<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calculator</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <div class="app">
    <a class="back-link" href="../index.html">← Tüm projeler</a>
    <div class="badge">01</div>
    <h1>Calculator</h1>
    <p class="subtitle">Temel matematik işlemlerini yapan hesap makinesi.</p>

    <div class="calc-display" id="display">0</div>
    <div class="grid grid-4">
      <button class="calc-btn clear" data-action="clear">C</button>
      <button class="calc-btn" data-action="backspace">⌫</button>
      <button class="calc-btn op" data-action="op" data-value="%">%</button>
      <button class="calc-btn op" data-action="op" data-value="/">÷</button>

      <button class="calc-btn" data-action="num" data-value="7">7</button>
      <button class="calc-btn" data-action="num" data-value="8">8</button>
      <button class="calc-btn" data-action="num" data-value="9">9</button>
      <button class="calc-btn op" data-action="op" data-value="*">×</button>

      <button class="calc-btn" data-action="num" data-value="4">4</button>
      <button class="calc-btn" data-action="num" data-value="5">5</button>
      <button class="calc-btn" data-action="num" data-value="6">6</button>
      <button class="calc-btn op" data-action="op" data-value="-">−</button>

      <button class="calc-btn" data-action="num" data-value="1">1</button>
      <button class="calc-btn" data-action="num" data-value="2">2</button>
      <button class="calc-btn" data-action="num" data-value="3">3</button>
      <button class="calc-btn op" data-action="op" data-value="+">+</button>

      <button class="calc-btn" data-action="num" data-value="0">0</button>
      <button class="calc-btn" data-action="num" data-value=".">.</button>
      <button class="calc-btn eq" data-action="equals">=</button>
    </div>

    <footer class="page-footer">Python (CLI) versiyonu: <a href="calculator.py">calculator.py</a></footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
