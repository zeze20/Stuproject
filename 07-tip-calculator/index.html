<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tip Calculator</title>
<link rel="stylesheet" href="../assets/style.css" />
</head>
<body>
  <div class="app">
    <a class="back-link" href="../index.html">← Tüm projeler</a>
    <div class="badge">07</div>
    <h1>Tip Calculator</h1>
    <p class="subtitle">Hesap tutarını, bahşiş yüzdesini ve kişi sayısını gir.</p>

    <label for="bill">Hesap tutarı</label>
    <input type="number" id="bill" min="0" step="0.01" value="100" />

    <label for="tipPercent">Bahşiş yüzdesi: <span id="tipPercentLabel">15</span>%</label>
    <input type="range" id="tipPercent" min="0" max="40" value="15" />

    <label for="people">Kişi sayısı</label>
    <input type="number" id="people" min="1" value="1" />

    <div class="result" id="result"></div>

    <footer class="page-footer">Python (CLI) versiyonu: <a href="tip_calculator.py">tip_calculator.py</a></footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
